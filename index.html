<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div class="animation-1">
        <svg width="300" height="140" viewBox="0 0 300 120">
          <path
            class="signature"
            pathLength="1"
            d="M10,80 C60,10 120,120 180,40 S260,10 290,60"
            fill="none"
            stroke="#fff"
            stroke-width="4"
          />
        </svg>
      </div>

      <div class="animation-2">
        <svg width="400" height="170" viewBox="0 0 400 150">
          <path
            id="track"
            pathLength="1"
            d="M10,120 C120,-20 280,320 390,30"
            fill="none"
            stroke="#ddd"
            stroke-width="2"
          />
          <circle class="ball" r="10" fill="#e17055" />
        </svg>
      </div>

      <div class="animation-3">
        <svg width="120" height="120">
          <circle cx="60" cy="60" r="15">
            <animate
              attributeName="r"
              values="15;30;15"
              dur="2s"
              repeatCount="indefinite"
            />
          </circle>
        </svg>
      </div>
    </div>
  </body>
</html>
